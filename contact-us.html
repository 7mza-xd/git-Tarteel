 <main>
     <!-- sec 1 -->
     <section>
        <h2>تواصل معنا</h2>
        <p>يسعدنا استقبال استفساراتكم و مقترحاتكم, ونسعى دائماً لتقديم تجربة أفضل لكم.</p>

    </section>


     <!-- sec 2 -->
     <section>
        <form>

            <label for="name" >الاسم الكامل</label>
                <input type="text"
                name="name"
                 id="name"
                 placeholder="أدخل الاسم الكامل">


            <br><br>

            

             <label for="email">البريد الإلكتروني</label>
                <input type="email"
                 name="email"
                 id="email"
                 placeholder="أدخل بريدك الالكتروني">


            <br><br>


            <label for="subject">موضوع الرسالة</label>
            <select name="subject" id="subject">
                <option value="" selected disabled hidden>اختر موضوع</option>
                <option value="program">استفسر عن برنامج</option>
                <option value="suggestion">اقتراح </option>
                <option value="technical">مشكلة تقنية </option>
                <option value="other">أخرى </option>


            </select>

            <br><br>

            <label for="message">رسالتك:</label>
            <br>
                <textarea name="message" id="message" rows="5"></textarea>

            <br><br>
            <button class="button" type="submit">إرسال الرسالة</button>
        </form>

    </section>
